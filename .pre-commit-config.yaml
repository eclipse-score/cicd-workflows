repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
        args:
          # Disable shellcheck and pyflakes for now, to enforce consistent behavior.
          - -shellcheck=
          - -pyflakes=
          # TODO: Remove once actionlint supports the `queue` key (rhysd/actionlint#654)
          - -ignore
          - 'unexpected key "queue" for "concurrency" section'
          # TODO: Remove when actionlint supports GitHub's $/ self-repository syntax.
          # Match only these internal actions; other malformed uses still fail.
          - -ignore
          - '^specifying action "\$/\.github/actions/(_merge-test-reports|_bazel-execute|_setup-netrc|_setup-qemu)" in invalid format because ref is missing\.'
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
