# Keep the parser and executor at the action's revision. The checked-out
# workspace belongs to the consumer and must not supply the central scripts.
name: Configured CI checks
description: Plan, execute or verify configured Bazel and typed quality checks
inputs:
  engine:
    description: Typed execution engine (bazel or quality)
    default: bazel
  mode:
    description: Operation to perform (plan, run or verify)
    required: true
  config:
    description: Checkout-relative configuration file for plan and run
    default: ""
  repository:
    description: Selected owner/name used to resolve repository artifact templates
    default: ${{ github.repository }}
  job:
    description: Planned matrix row to execute
    default: ""
  reports:
    description: Directory containing generated or downloaded evidence
    required: true
  expected:
    description: JSON plan produced by preparation, required for verify
    default: ""
  source-commit:
    description: Observed preparation checkout, required for verify
    default: ""
outputs:
  has-checks:
    description: Whether the quality plan contains checks
    value: ${{ steps.execute.outputs.has-checks }}
  has-codeql:
    description: Whether the quality plan contains SARIF analysis
    value: ${{ steps.execute.outputs.has-codeql }}
  matrix:
    description: GitHub matrix with one row per configured check
    value: ${{ steps.execute.outputs.matrix }}
  expected:
    description: Complete plan against which reports must be verified
    value: ${{ steps.execute.outputs.expected }}
  artifact-prefix:
    description: Unique namespace for this invocation's matrix artifacts
    value: ${{ steps.execute.outputs.artifact-prefix }}
  artifacts:
    description: JSON mapping row identifiers to report, test-log and coverage artifact names
    value: ${{ steps.execute.outputs.artifacts }}
  docs:
    description: Planned Docs build with resolved report artifacts
    value: ${{ steps.execute.outputs.docs }}
  results:
    description: Verified checkout and per-job command observations
    value: ${{ steps.execute.outputs.results }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Run the central implementation
      id: execute
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        ENGINE: ${{ inputs.engine }}
        MODE: ${{ inputs.mode }}
        CONFIG_PATH: ${{ inputs.config }}
        JOB_ID: ${{ inputs.job }}
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        REPORTS: ${{ inputs.reports }}
        EXPECTED: ${{ inputs.expected }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
      run: |
        # Native x86_64, ARM cross-compilation and QEMU user-mode tests share
        # Linux x86_64 runners. The plan selects emulation explicitly; the
        # module Bazel config supplies the target toolchain and test wrapper.
        test "$(uname -s)" = Linux
        test "$(uname -m)" = x86_64

        # uv uses the central action's locked project, not the consumer's Python
        # environment. A consumer needs neither Python dependencies nor uv.lock.
        case "$ENGINE" in
          bazel) implementation=configured_checks.py ;;
          quality) implementation=configured_quality.py ;;
          *) echo "Unknown configured engine: $ENGINE" >&2; exit 1 ;;
        esac
        project="$(realpath "$ACTION_DIRECTORY/../../..")"
        uv run --locked --no-dev --project "$project" python \
          "$project/tools/$implementation" "$MODE" \
          --workspace "$GITHUB_WORKSPACE" --reports "$REPORTS"
