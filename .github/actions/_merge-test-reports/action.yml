# Internal implementation for docs.yml; its inputs are not a public action API.
name: Merge test report artifacts
description: Download selected artifacts and combine their files with conflict detection
inputs:
  artifacts:
    description: Artifact names or * patterns from the current run, one per line
    required: true
  destination:
    description: Directory in which to combine reports while preserving relative paths
    required: true
outputs:
  error-code:
    description: Expected report error (no-reports or file-conflict); empty for unexpected failures
    value: ${{ steps.merge.outputs.error-code }}
runs:
  using: composite
  steps:
    - name: Prepare download pattern and directory
      id: selection
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        echo "downloads=$(mktemp -d "$RUNNER_TEMP/docs-test-reports.XXXXXX")" >> "$GITHUB_OUTPUT"
        python3 "$ACTION_DIRECTORY/merge_reports.py" pattern --artifacts="$ARTIFACTS" --output "$GITHUB_OUTPUT"
    - name: Download selected test reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ steps.selection.outputs.pattern }}
        path: ${{ steps.selection.outputs.downloads }}
        # Preserve archive boundaries even when exactly one match is downloaded.
        skip-decompress: true
        merge-multiple: false
    # The Python helper belongs to this action's revision, independently of the
    # consumer checkout. It extracts the downloaded archives and checks file
    # conflicts before the documentation build.
    - name: Merge report files
      id: merge
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        DOWNLOADS: ${{ steps.selection.outputs.downloads }}
        DESTINATION: ${{ inputs.destination }}
      run: >-
        python3 "$ACTION_DIRECTORY/merge_reports.py" merge
        --downloads "$DOWNLOADS" --destination "$DESTINATION"
