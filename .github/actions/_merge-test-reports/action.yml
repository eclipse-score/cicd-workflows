# Internal implementation for docs.yml; its inputs are not a public action API.
name: Merge test report artifacts
description: Download selected artifacts and combine their files with conflict detection
inputs:
  artifacts:
    description: Artifact names or * patterns from the current run, one per line
    required: true
  destination:
    description: Directory in which to combine reports while preserving relative paths
    required: true
runs:
  using: composite
  steps:
    - name: Create download directory
      id: selection
      shell: bash
      run: echo "downloads=$(mktemp -d "$RUNNER_TEMP/docs-test-reports.XXXXXX")" >> "$GITHUB_OUTPUT"
    - name: Resolve artifact selection
      id: reports
      # JavaScript actions receive the run-scoped artifact service credentials;
      # ordinary shell steps do not. Pass that environment to the helper.
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        ARTIFACTS: ${{ inputs.artifacts }}
      with:
        script: |
          const {execFileSync} = require('node:child_process');
          execFileSync('python3', [
            `${process.env.ACTION_DIRECTORY}/merge_reports.py`, 'select',
            '--artifacts', process.env.ARTIFACTS, '--output', process.env.GITHUB_OUTPUT,
          ], {stdio: 'inherit'});
    - name: Download selected test reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.reports.outputs.ids }}
        path: ${{ steps.selection.outputs.downloads }}
        # Keep each artifact separate until every file can be checked for conflicts.
        merge-multiple: false
    # The Python helper belongs to this action's revision, independently of the
    # consumer checkout. It copies only the resolved selection and checks file
    # conflicts before the documentation build.
    - name: Merge report files
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        NAMES: ${{ steps.reports.outputs.names }}
        DOWNLOADS: ${{ steps.selection.outputs.downloads }}
        DESTINATION: ${{ inputs.destination }}
      run: >-
        python3 "$ACTION_DIRECTORY/merge_reports.py" merge
        --names "$NAMES" --downloads "$DOWNLOADS" --destination "$DESTINATION"
