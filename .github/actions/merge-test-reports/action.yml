name: Merge test report artifacts
description: Download selected artifacts and combine their files with conflict detection
inputs:
  artifacts:
    description: Nonempty JSON array of exact plain artifact names from the current workflow run
    required: true
  destination:
    description: Directory in which to combine reports while preserving relative paths
    required: true
runs:
  using: composite
  steps:
    # Run the implementation from this action, independently of the consumer's
    # checkout and Python environment. Only the standard library is needed.
    - name: Prepare test report download
      id: selection
      shell: python
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        import os
        import sys
        import tempfile

        sys.path.insert(0, os.environ['ACTION_DIRECTORY'])
        from merge_reports import artifact_names

        names = artifact_names(os.environ['ARTIFACTS'])
        downloads = tempfile.mkdtemp(prefix='docs-test-reports-', dir=os.environ['RUNNER_TEMP'])
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'pattern=@({"|".join(names)})\ndownloads={downloads}\n')
    - name: Download selected test reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ steps.selection.outputs.pattern }}
        path: ${{ steps.selection.outputs.downloads }}
        # Keep each artifact separate until every file can be checked for conflicts.
        merge-multiple: false
    - name: Merge report files
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        ARTIFACTS: ${{ inputs.artifacts }}
        DOWNLOADS: ${{ steps.selection.outputs.downloads }}
        DESTINATION: ${{ inputs.destination }}
      run: >-
        python3 "$ACTION_DIRECTORY/merge_reports.py"
        --artifacts "$ARTIFACTS" --downloads "$DOWNLOADS" --destination "$DESTINATION"
