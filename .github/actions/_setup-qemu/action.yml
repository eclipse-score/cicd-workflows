name: Setup QEMU
description: Install full-system emulators and disk utilities, and allow the runner user to access KVM.
runs:
  using: composite
  steps:
    - name: Install QEMU emulators and disk utilities
      uses: eclipse-score/apt-install@d545215b973c4151236fcb3f75480dffcb914835
      with:
        packages: qemu-system qemu-utils
        cache: false
    - name: Enable KVM access
      shell: bash
      # Reload the device rule for this runner process, without requiring a new login.
      # Bazel targets own VM startup and shutdown; this action only prepares the host.
      run: |
        set -euo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
