name: Required Approvals

on:
  workflow_call:
    inputs:
      min_approvals: {type: number, default: 1, required: false}
      approval_mode: {type: string, default: ALL, required: false}
      org_name: {type: string, default: score, required: false}
      pat_secret: {type: string, required: false, description: "Override secret name"}
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private dependencies; omit when using `token`
        required: false
        default: ""
        type: string
    secrets:
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private dependencies
        required: false
      token:
        description: Token for private dependencies; an alternative to GitHub App credentials
        required: false
      SCORE_APPROVALS_PAT:
        description: Org-scoped PAT used to read approvals across the organization
        required: false

jobs:
  check-approvals:
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Check for required approvals (CODEOWNERS)
        id: check-approvals
        uses: skymoore/required-approvals@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fallback to SCORE_APPROVALS_PAT if no override is provided
          read_org_scoped_token: ${{ secrets[inputs.pat_secret] || secrets.SCORE_APPROVALS_PAT }}
          org_name: ${{ inputs.org_name }}
          min_approvals: ${{ inputs.min_approvals }}
          approval_mode: ${{ inputs.approval_mode }}
          require_all_approvals_latest_commit: true

      - name: Run action if all required approvals are met
        if: ${{ steps.check-approvals.outputs.approved == 'true' }}
        run: echo "✅ All required approvals are met. Proceeding."
