# Actually hourly, but such workflows are commonly named "daily" 
name: Daily

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  maintenance:
    uses: ./.github/workflows/daily.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write # Required to mark and close stale pull requests.
      pages: write # Required to delete obsolete GitHub Pages artifacts and caches.
      id-token: write
      actions: write # Required to delete obsolete GitHub Actions caches.

  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout config file
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          token: ${{ secrets.SCORE_BOT_CLASSIC_PAT }}
          configurationFile: .github/renovate.json5
        env:
          LOG_LEVEL: debug
