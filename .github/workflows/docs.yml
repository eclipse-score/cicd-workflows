name: Documentation Build

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Documentation artifact name after a successful upload
        value: ${{ jobs.docs-build.outputs.artifact-name }}
    inputs:
      allow-missing-reports:
        description: Build with available reports after producer failures; list missing reports in the summary
        type: boolean
        default: false
      tests-report-artifacts:
        description: JSON array of test artifacts to merge; rejects conflicting package paths
        type: string
        default: '[]'
      artifact-server-url:
        description: Optional HTTPS server for authenticated dependency downloads
        type: string
        default: ""
      repository:
        description: Repository to document; defaults to the caller repository
        type: string
        default: ""
      ref:
        description: Checkout revision; defaults to the caller event
        type: string
        default: ""
      bazel-label:
        description: Structured Bazel run target; overrides the legacy bazel-target command string
        type: string
        default: ""
      github-context:
        description: Deprecated compatibility input; repository context is supplied automatically
        type: boolean
        default: false
      retention-days:
        description: "Number of days to retain the artifact"
        required: false
        default: 1
        type: number
      bazel-target:
        description: "The Bazel target to build (e.g., //:docs)"
        required: false
        type: string
        default: "//:docs"
      tests-report-artifact:
        description: "Name of the artifact that contains test reports"
        required: false
        default: ""
        type: string
      coverage-report-artifact:
        description: "Name of the artifact containing plain LCOV as coverage.lcov or coverage_report.dat at its root"
        required: false
        default: ""
        type: string
      deployment_type:
        description: "Deprecated; retained for compatibility and no longer used"
        required: false
        default: "workflow"
        type: string
      gh_app_client_id:
        description: "GitHub App Client ID for inter-repo access (not used in public S-CORE)"
        required: false
        default: ""
        type: string
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
    secrets:
      artifact-server-user:
        description: Optional artifact server login
        required: false
      artifact-server-token:
        description: Optional artifact server token
        required: false
      gh_app_private_key:
        description: "GitHub App Private Key for inter-repo access (not used in public S-CORE)"
        required: false
      token:
        description: "GitHub Token for inter-repo access (not used in public S-CORE)"
        required: false

env:
  CACHE_KEY_PREFIX: bazel-cache
  # docs-publish.yml downloads the artifact by this name; keep both in sync.
  DOCS_ARTIFACT_NAME: github-pages

jobs:
  docs-build:
    name: Build Documentation
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-id && env.DOCS_ARTIFACT_NAME || '' }}
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/cicd-workflows/.github/actions/build-environment@central-workflow
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.gh_app_client_id }}
          github-app-private-key: ${{ secrets.gh_app_private_key }}
          artifact-server-url: ${{ inputs.artifact-server-url }}
          artifact-server-user: ${{ secrets.artifact-server-user }}
          artifact-server-token: ${{ secrets.artifact-server-token }}
          profile: docs

      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # Reuse the token from inter-repo-access action to ensure access to private repos
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ inputs.repository != '' && format('{0}-{1}', github.job, inputs.repository) || github.job }}
          disk-cache-restore: ${{ (inputs.repository != '' || inputs.ref != '') && 'true' || 'auto' }}
          repository-cache-restore: ${{ (inputs.repository != '' || inputs.ref != '') && 'true' || 'auto' }}

      - name: Download test report
        if: inputs.tests-report-artifact != '' && inputs.tests-report-artifacts == '[]' && !inputs.allow-missing-reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.tests-report-artifact }}
          path: tests-report

      - name: Download selected test reports
        if: ${{ inputs.tests-report-artifacts != '[]' || (inputs.allow-missing-reports && inputs.tests-report-artifact != '') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ format('@({0})', join(fromJSON(inputs.tests-report-artifacts != '[]' && inputs.tests-report-artifacts || format('["{0}"]', inputs.tests-report-artifact)), '|')) }}
          path: ${{ runner.temp }}/docs-test-artifacts

      - uses: eclipse-score/cicd-workflows/.github/actions/configured-checks@central-workflow
        if: ${{ inputs.tests-report-artifacts != '[]' || (inputs.allow-missing-reports && inputs.tests-report-artifact != '') }}
        env:
          TEST_REPORT_DOWNLOADS: ${{ runner.temp }}/docs-test-artifacts
          TEST_REPORT_ARTIFACTS: ${{ inputs.tests-report-artifacts != '[]' && inputs.tests-report-artifacts || format('["{0}"]', inputs.tests-report-artifact) }}
          ALLOW_MISSING_REPORTS: ${{ inputs.allow-missing-reports }}
        with:
          engine: test-reports
          mode: merge
          reports: ${{ github.workspace }}/tests-report

      - name: Download coverage report
        if: inputs.coverage-report-artifact != '' && !inputs.allow-missing-reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.coverage-report-artifact }}
          path: coverage-report

      # Pattern downloads allow absent reports without hiding download errors.
      - name: Download available coverage report
        if: inputs.coverage-report-artifact != '' && inputs.allow-missing-reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.coverage-report-artifact }}
          merge-multiple: true
          path: coverage-report

      - name: Prepare coverage report
        if: inputs.coverage-report-artifact != ''
        env:
          ALLOW_MISSING_REPORTS: ${{ inputs.allow-missing-reports }}
        run: |
          if [[ "$ALLOW_MISSING_REPORTS" == true && ! -d coverage-report ]]; then
            echo "Coverage report unavailable; building documentation without it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$ALLOW_MISSING_REPORTS" == true && -d coverage-report && -z "$(ls -A coverage-report)" ]]; then
            echo "Coverage report unavailable; building documentation without it." >> "$GITHUB_STEP_SUMMARY"
            rmdir coverage-report
            exit 0
          fi
          if [[ ! -f coverage-report/coverage_report.dat ]]; then
            if [[ ! -f coverage-report/coverage.lcov ]]; then
              echo "::error::The coverage artifact must contain plain LCOV as coverage.lcov or coverage_report.dat at its root."
              exit 1
            fi
            # The Docs CLI expects this fixed path; coverage artifacts use coverage.lcov.
            mv coverage-report/coverage.lcov coverage-report/coverage_report.dat
          fi

      # Keep the established command-string interface for existing callers.
      # Configured builds use argv and the checked-out repository identity.
      - name: Build configured documentation
        if: inputs.bazel-label != ''
        env:
          BAZEL_LABEL: ${{ inputs.bazel-label }}
          DOCS_REPOSITORY: ${{ inputs.repository || github.repository }}
        shell: python
        run: |
          import os
          import subprocess

          argv = ['bazel', 'run', '--lockfile_mode=error', os.environ['BAZEL_LABEL'], '--']
          # The Docs CLI reads repository context from its environment.
          environment = dict(os.environ, GITHUB_REPOSITORY=os.environ['DOCS_REPOSITORY'])
          subprocess.run(argv, env=environment, check=True)

      - name: Build documentation
        if: inputs.bazel-label == ''
        run: bazel run ${{ inputs.bazel-target }}

      - name: Upload documentation artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DOCS_ARTIFACT_NAME }}
          path: _build
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
