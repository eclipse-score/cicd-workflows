name: Repository cache maintenance
# User documentation: see cache-maintenance.md.
#
# Developer notes:
# - The repository cache is keyed by MODULE.bazel.lock. A changed lockfile
#   creates a replacement cache; an unchanged lockfile leaves it untouched.
# - Disk caches accumulate action outputs until a lockfile change, when they
#   are deleted to prevent stale output and unbounded growth.
# - Push events and manual dispatches write or remove caches; the caller's push
#   trigger or the manually selected ref determines the cache-writing branch.
# - Cache construction is serialized per branch. Read-only validation runs use
#   their run ID and may proceed concurrently.

on:
  workflow_call:
    inputs:
      variants:
        description: |-
          Newline-separated list of arguments to append to `bazel fetch`.
          Each line is split on whitespace and passed as one fetch invocation.
          Examples: `--config=x86_64-linux //...`, `//...`, `//test //quality`.
        required: true
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private Bazel dependencies; omit when using `token`
        required: false
        default: ""
        type: string
    secrets:
      score-qnx-license:
        description: Base64-encoded QNX license content (DEPRECATED; use `qnx-license` instead)
        required: false
      score-qnx-user:
        description: QNX account username (DEPRECATED; use `qnx-user` instead)
        required: false
      score-qnx-password:
        description: QNX account password (DEPRECATED; use `qnx-password` instead)
        required: false
      qnx-license:
        description: Base64-encoded QNX license content
        required: false
      qnx-user:
        description: QNX account username
        required: false
      qnx-password:
        description: QNX account password
        required: false
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private Bazel dependencies
        required: false
      token:
        description: Token for private Bazel dependencies; an alternative to GitHub App credentials
        required: false

env:
  # Only push and manual-dispatch runs may create or delete shared caches.
  DRY_RUN: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}

concurrency:
  # Serialize cache writers, but do not serialize independent dry runs.
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.workflow, github.ref_name) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  repository_cache_maintenance:
    name: Create new repository cache if required
    runs-on: ubuntu-24.04
    outputs:
      should_refresh_cache: ${{ steps.check.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          lfs: true
          fetch-depth: 2 # Required by changed-files for push events.
          persist-credentials: true

      # MODULE.bazel.lock determines the external repositories that a Bazel
      # repository cache contains.
      - name: Check if Bazel repository cache inputs changed
        id: check
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            MODULE.bazel.lock

      # A replacement cache can redownload all dependencies.
      - uses: eclipse-score/more-disk-space@3fac5780033e636b114cf69e891dc19d640855c2 # v1.1
        if: ${{ steps.check.outputs.any_changed == 'true' && env.DRY_RUN == 'false' }}

      - name: Create Bazel output base directory
        if: ${{ steps.check.outputs.any_changed == 'true' || env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/.bazel
          sudo chown -R $USER:$USER /mnt/.bazel

      - name: Setup Bazel
        if: ${{ steps.check.outputs.any_changed == 'true' || env.DRY_RUN == 'true' }}
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90
        with:
          unique-cache-name: ${{ github.job }}
          # setup-bazel-cache saves whenever its `main-branch` matches the
          # current ref. Only cache-writing events may match that ref.
          main-branch: ${{ env.DRY_RUN == 'false' && github.ref_name || '__cache_maintenance_read_only' }}
          # The post-step uploads the newly warmed cache; restoring the old
          # cache first would defeat a lockfile-driven refresh.
          skip-cache-restore: true

      # Required only while constructing a cache after a cache-writing event.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@212bbf86267e9381da9d2daf962d12f6feafbc90
        if: ${{ steps.check.outputs.any_changed == 'true' && env.DRY_RUN == 'false' }}

      - name: Check QNX secret availability
        id: qnx_secrets
        if: ${{ steps.check.outputs.any_changed == 'true' && env.DRY_RUN == 'false' }}
        shell: bash
        env:
          # Prefer the current interface; retain legacy names for migration.
          QNX_LICENSE: ${{ secrets.qnx-license || secrets.score-qnx-license }}
          QNX_USER: ${{ secrets.qnx-user || secrets.score-qnx-user }}
          QNX_PASSWORD: ${{ secrets.qnx-password || secrets.score-qnx-password }}
        run: |
          set -euo pipefail
          if [[ -n "${QNX_LICENSE}" && -n "${QNX_USER}" && -n "${QNX_PASSWORD}" ]]; then
            echo "has_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QNX SDP usage
        if: ${{ steps.check.outputs.any_changed == 'true' && env.DRY_RUN == 'false' && steps.qnx_secrets.outputs.has_all == 'true' }}
        uses: eclipse-score/cicd-actions/setup-qnx-sdp@212bbf86267e9381da9d2daf962d12f6feafbc90
        with:
          qnx-license: ${{ secrets.qnx-license || secrets.score-qnx-license }}
          qnx-user: ${{ secrets.qnx-user || secrets.score-qnx-user }}
          qnx-password: ${{ secrets.qnx-password || secrets.score-qnx-password }}
          qnx-license-dir: /opt/score_qnx/license

      - name: Configure access to private Bazel dependencies
        uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
        env:
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        # Pull-request workflows execute code from the proposed change. Do not
        # expose private-dependency credentials to either PR event type.
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (env.HAS_GH_APP_PRIVATE_KEY == 'true' || env.HAS_TOKEN == 'true') }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}

      # The action performs one fetch per `variants` line. Read-only events
      # must not upload a cache.
      - name: Validate variants and warm Bazel repository cache artifacts
        if: ${{ steps.check.outputs.any_changed == 'true' || env.DRY_RUN == 'true' }}
        uses: eclipse-score/cicd-actions/warm-bazel-repository-cache@212bbf86267e9381da9d2daf962d12f6feafbc90
        with:
          variants: ${{ inputs.variants }}
          dry-run: ${{ env.DRY_RUN }}

  prune_old_caches:
    # This must be a separate job: setup-bazel-cache uploads in a post-step;
    # pruning earlier could leave consumers without a repository cache.
    runs-on: ubuntu-24.04
    permissions:
      actions: write # Required to delete GitHub Actions caches.
      contents: read
    needs: repository_cache_maintenance

    # Cache pruning mutates shared Actions caches; keep PR and merge-queue runs read-only.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Delete all disk caches
        # A changed lockfile invalidates Bazel action outputs; otherwise retain warm disk caches.
        if: ${{ needs.repository_cache_maintenance.outputs.should_refresh_cache == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Disk cache keys are marked with `-disk-`; repository/Bazelisk
          # caches are handled separately by prune-cache below.
          set -euo pipefail
          gh cache list --repo ${{ github.repository }} --limit 1000 --json id,key \
          | jq -r '.[] | select(.key | contains("-disk-")) | .id' \
          | xargs -r -n1 gh cache delete --repo ${{ github.repository }}

      - name: Prune obsolete cache generations
        uses: eclipse-score/cicd-actions/prune-cache@212bbf86267e9381da9d2daf962d12f6feafbc90
