name: Repository cache maintenance
# Check cache inputs and recreate repository cache only when required.
# Fetch dependencies for configured variants and upload a single repository cache.
# This workflow should be the only one which uploads a repository cache.
#
# Cache strategies:
# - repository cache: refreshed when MODULE.bazel.lock changes.
#   In this case **ALL** caches will be rebuild from scratch and the old one deleted.
#   Deletion of all caches is done to limit the growth of the disk caches.
# - disk cache: Except when MODULE.bazel.lock changes, this is never deleted by this workflow.
#   Deletion has to be taken care of by the calling workflow.
#   With each workflow run the old disk cache (if it exists) is restored and using that a new one is build.
#   The new disk cache is uploaded and the calling workflow needs to delete old ones using eclipse-score/cicd-actions/prune-cache as last step.

on:
  workflow_call:
    inputs:
      variants:
        description: |-
          Newline-separated list of arguments to append to `bazel fetch`.
          Each line is split on whitespace and passed as one fetch invocation.
          Examples: `--config=x86_64-linux //...`, `//...`, `//test //quality`.
        required: true
        type: string
    secrets:
      score-qnx-license:
        description: Base64-encoded QNX license content
        required: false
      score-qnx-user:
        description: QNX account username
        required: false
      score-qnx-password:
        description: QNX account password
        required: false

jobs:
  repository_cache_maintenance:
    name: Create new repository cache if required
    runs-on: ubuntu-24.04
    outputs:
      should_refresh_cache: ${{ steps.check.outputs.should_refresh_cache }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if Bazel repository cache inputs changed
        id: check
        uses: eclipse-score/cicd-actions/repository-cache-check@use-lurtz-setup-bazel-part-2

      - uses: eclipse-score/more-disk-space@v1
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' }}

      - name: Create Bazel output base directory
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/.bazel
          sudo chown -R $USER:$USER /mnt/.bazel

      - name: Setup Bazel
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' }}
        uses: eclipse-score/cicd-actions/setup-bazel-cache@use-lurtz-setup-bazel-part-2
        with:
          unique-cache-name: ${{ github.job }}
          skip-cache-restore: true

      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@30ed908edcf367bc38ebff5b386a244f9b6417a7 # 2025-06-04
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' }}

      - name: Check QNX secret availability
        id: qnx_secrets
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' }}
        shell: bash
        env:
          QNX_LICENSE: ${{ secrets.score-qnx-license }}
          QNX_USER: ${{ secrets.score-qnx-user }}
          QNX_PASSWORD: ${{ secrets.score-qnx-password }}
        run: |
          set -euo pipefail
          if [[ -n "${QNX_LICENSE}" && -n "${QNX_USER}" && -n "${QNX_PASSWORD}" ]]; then
            echo "has_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QNX SDP usage
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' && steps.qnx_secrets.outputs.has_all == 'true' }}
        uses: eclipse-score/cicd-actions/setup-qnx-sdp@a2b3c36fc7d1b9d03880d19935c7ac9cfffe58c6 # 2026-05-19
        with:
          qnx-license: ${{ secrets.score-qnx-license }}
          qnx-user: ${{ secrets.score-qnx-user }}
          qnx-password: ${{ secrets.score-qnx-password }}
          qnx-license-dir: /opt/score_qnx/license

      - name: Refresh Bazel repository cache artifacts
        if: ${{ steps.check.outputs.should_refresh_cache == 'true' }}
        uses: eclipse-score/cicd-actions/repository-cache-refresh@use-lurtz-setup-bazel-part-2
        with:
          variants: ${{ inputs.variants }}

  prune_old_caches:
    # Extra job for deletion of caches is needed to avoid time window with no repository cache available.
    # `setup-bazel-cache` uploads caches in its post step. With an extra job we can be sure that is finished.
    runs-on: ubuntu-24.04
    permissions:
      actions: write # needed for cache deletion
      contents: read
    needs: repository_cache_maintenance
    if: ${{ needs.repository_cache_maintenance.outputs.should_refresh_cache == 'true' }}
    steps:
      - name: Delete all disk caches
        run: |
          gh cache list --limit 1000 --json id,key \
          | jq -r '.[] | select(.key | contains("-disk-")) | .id' \
          | xargs -n1 gh cache delete
      - name: Prune repository cache
        uses: eclipse-score/cicd-actions/prune-cache@8e69f47b45778afd3b0d069c0456184c4ceeffe7
