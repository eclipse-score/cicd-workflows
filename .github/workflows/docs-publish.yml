name: Publish Documentation

# Assuming you have one workflow that builds the documentation artifact (e.g., "PR"),
# this workflow can be used to deploy the documentation to GitHub Pages in a versioned manner.
# It also updates a versions.json file to keep track of available documentation versions and
# comments on the PR with a link to the preview if applicable.
# Note: this can be used with any documentation-building workflow, not only docs-as-code.

# It will use gh-pages branch internally to mix the new documentation with the existing one.
# Use daily.yml to clean up old documentation versions (merged PRs).

# Usage:
# on:
#   workflow_run:
#     workflows: ["PR"] # <-- name of the workflow that builds the documentation artifact
#     types:
#       - completed
# jobs:
#   docs-deploy:
#     if: github.event.workflow_run.conclusion == 'success'
#     uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@<HASH>
#     permissions:
#       pages: write
#       id-token: write
#       contents: write
#       pull-requests: write

on:
  workflow_call:

concurrency:
  group: cicd-pages-deploy
  cancel-in-progress: false
  queue: max

jobs:
  docs-deploy:
    name: Deploy documentation to GitHub Pages
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # to verify the deployment originates from an appropriate source
      contents: write # to update versions.json and commit to gh-pages
      pull-requests: write # to comment on PRs with preview link
    runs-on: ${{ vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    steps:
      - name: Resolve build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO_OWNER: ${{ github.event.workflow_run.head_repository.owner.login || '' }}
        run: |
          EVENT_NAME="${{ github.event.workflow_run.event }}"
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number || '' }}"
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          CHECK_SUITE_ID="${{ github.event.workflow_run.check_suite_id || '' }}"

          # Some fork-origin workflow_run payloads do not include pull_requests[];
          # resolve the PR from the run's HEAD commit as a fallback.
          # If the workflow_run references a check suite, use it to recover the PR number.
          if [[ -z "$PR_NUMBER" && -n "$CHECK_SUITE_ID" ]]; then
            PR_NUMBER="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/check-suites/${CHECK_SUITE_ID}" \
              | jq -r '.pull_requests[]? | select(.number != null) | .number' \
              | head -n1 || true)"
          fi

          if [[ -z "$PR_NUMBER" && -n "$HEAD_SHA" ]]; then
            PR_NUMBER="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              | jq -r '.[] | select(.state == "open") | .number' \
              | head -n1 || true)"
          fi

          # pull_request_target runs may not expose pull_requests[] in workflow_run payload.
          # Fallback to searching by head owner + branch to find the matching open PR.
          if [[ "$EVENT_NAME" == "pull_request_target" && -z "$PR_NUMBER" && -n "$HEAD_REPO_OWNER" && -n "$REF_NAME" ]]; then
            PR_NUMBER="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls?state=open&head=${HEAD_REPO_OWNER}:${REF_NAME}" \
              | jq -r '.[0].number // empty' || true)"
          fi

          if [[ "$PR_NUMBER" == "null" ]]; then
            PR_NUMBER=""
          fi

          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            IS_PR_CONTEXT="true"
          else
            IS_PR_CONTEXT="false"
          fi

          echo "event_name=$EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "is_pr_context=$IS_PR_CONTEXT" >> "$GITHUB_OUTPUT"

      - name: Determine target folder
        if: steps.metadata.outputs.should_deploy == 'true'
        id: target
        run: |
          if [[ -n "${{ steps.metadata.outputs.pr_number }}" ]]; then
            echo "folder=pr-${{ steps.metadata.outputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "folder=${{ steps.metadata.outputs.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure gh-pages branch exists with initial files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if ! git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages; then
            echo "gh-pages branch does not exist. Creating it..."
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
            cd repo
            git fetch origin main --depth=1
            AUTHOR_NAME=$(git log origin/main -1 --pretty=format:'%an')
            AUTHOR_EMAIL=$(git log origin/main -1 --pretty=format:'%ae')
            git config user.name "$AUTHOR_NAME"
            git config user.email "$AUTHOR_EMAIL"
            echo "Using commit identity: $AUTHOR_NAME <$AUTHOR_EMAIL>"

            git checkout --orphan gh-pages
            git rm -rf . || true
            REPO_NAME=$(basename "${REPO}")
            OWNER_NAME="${REPO%%/*}"

            touch versions.json
            echo "[" > versions.json
            echo "  {" >> versions.json
            echo "    \"version\": \"main\"," >> versions.json
            echo "    \"url\": \"https://${OWNER_NAME}.github.io/${REPO_NAME}/main/\"" >> versions.json
            echo "  }" >> versions.json
            echo "]" >> versions.json

            touch index.html
            echo '<!DOCTYPE html>' > index.html
            echo '<html lang="en">' >> index.html
            echo '<head>' >> index.html
            echo '    <meta charset="UTF-8">' >> index.html
            echo '    <meta http-equiv="refresh" content="0; URL=main/">' >> index.html
            echo '    <title>Redirecting...</title>' >> index.html
            echo '</head>' >> index.html
            echo '<body>' >> index.html
            echo '    <p>If you are not redirected, <a href="main/">click here</a>.</p>' >> index.html
            echo '</body>' >> index.html
            echo '</html>' >> index.html

            touch .nojekyll
            git add versions.json index.html .nojekyll
            git commit -m "Initialize gh-pages branch with versions.json and index.html"
            git push origin gh-pages
            cd ..
            rm -rf repo
          else
            echo "gh-pages branch exists. Skipping creation."
          fi

      - name: Checkout gh-pages
        if: steps.metadata.outputs.should_deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-content

      - name: Clean up old documentation
        if: steps.metadata.outputs.should_deploy == 'true'
        run: |
          rm -rf "gh-pages-content/${{ steps.target.outputs.folder }}"

      - name: Download documentation artifact
        if: steps.metadata.outputs.should_deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: gh-pages-content/${{ steps.target.outputs.folder }}

      - name: Ensure .nojekyll exists
        if: steps.metadata.outputs.should_deploy == 'true'
        run: touch gh-pages-content/.nojekyll

      - name: Extend versions.json
        if: steps.metadata.outputs.should_deploy == 'true'
        run: |
          TARGET="${{ steps.target.outputs.folder }}"

          # if versions.json does not exist, create it with an empty array as content
          if [ ! -f gh-pages-content/versions.json ]; then
            echo '[]' > gh-pages-content/versions.json
          fi

          # Add new version entry to versions.json if it doesn't already exist
          if jq -e --arg v "$TARGET" 'map(select(.version == $v)) | length > 0' gh-pages-content/versions.json > /dev/null; then
            echo "Version '$TARGET' already exists in versions.json"
          else
            REPO_NAME=$(basename "${{ github.repository }}")
            OWNER_NAME="${{ github.repository_owner }}"
            PAGES_URL="https://${OWNER_NAME}.github.io/${REPO_NAME}"
            jq --arg v "$TARGET" --arg u "${PAGES_URL}/${TARGET}/" \
              '. + [{"version": $v, "url": $u}]' gh-pages-content/versions.json > gh-pages-content/tmp.json && mv gh-pages-content/tmp.json gh-pages-content/versions.json
          fi

      - name: Commit and push changes to gh-pages
        if: steps.metadata.outputs.should_deploy == 'true'
        run: |
          cd gh-pages-content
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update documentation for ${{ steps.target.outputs.folder }}" || echo "No changes to commit"
          git push

      - name: Remove git metadata before creating Pages artifact
        if: steps.metadata.outputs.should_deploy == 'true'
        run: rm -rf gh-pages-content/.git

      - name: Create artifact from gh-pages
        if: steps.metadata.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages-content

      - name: Deploy artifact to GitHub Pages
        if: steps.metadata.outputs.should_deploy == 'true'
        id: deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Find existing PR comment
        if: always() && steps.metadata.outputs.should_deploy == 'true' && steps.metadata.outputs.pr_number != ''
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ steps.metadata.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: Documentation preview for this pull request

      - name: Comment on PR with preview link
        if: always() && steps.metadata.outputs.should_deploy == 'true' && steps.metadata.outputs.pr_number != '' && steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ steps.metadata.outputs.pr_number }}
          body: |
            Documentation preview for this pull request is available at:
            **${{ steps.target.outputs.folder }}**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.folder }}/
