name: Sync with eclipse-score/module_template repository
on:
  workflow_call:
    inputs:
      pr_title:
        description: "Title for the template sync pull request"
        type: string
        default: "[Template Sync] Upstream template update"
      pr_commit_msg:
        description: "Commit message for the template sync"
        type: string
        default: "chore(template): upstream template update"
      template_sync_ignore_file_path:
        description: "Path to the template sync ignore file"
        type: string
        default: ".github/.templatesyncignore"
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private dependencies; omit when using `token`
        required: false
        default: ""
        type: string
    secrets:
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private dependencies
        required: false
      token:
        description: Token for private dependencies; an alternative to GitHub App credentials
        required: false
      SCORE_APPROVALS_PAT:
        description: Org-scoped PAT used to read approvals across the organization
        required: false

jobs:
  repo-sync:
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false # 

      - name: Configure access to private dependencies
        uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
        # An `if` condition cannot access secrets, so expose only their presence.
        env:
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        if: ${{ env.HAS_GH_APP_PRIVATE_KEY == 'true' || env.HAS_TOKEN == 'true' || inputs.github-app-client-id != '' }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}
      - name: Sync Template Changes
        uses: AndreasAugustin/actions-template-sync@v2.5.3
        with:
          source_gh_token: ${{ secrets.SCORE_APPROVALS_PAT}}
          target_gh_token: ${{ secrets.SCORE_APPROVALS_PAT}}
          source_repo_path: "eclipse-score/module_template"
          upstream_branch: "main"
          pr_title: ${{ inputs.pr_title }}
          pr_commit_msg: ${{ inputs.pr_commit_msg }}
          git_user_name: eclipse-score-bot
          git_user_email: 187756813+eclipse-score-bot@users.noreply.github.com
          template_sync_ignore_file_path: ${{ inputs.template_sync_ignore_file_path }}
