name: License Check

on:
  workflow_call:
    inputs:
      repo-url:
        description: "Repository URL"
        required: false
        type: string
      bazel-target:
        description: "Custom Bazel target to run (e.g., 'run //:license-check')"
        required: false
        default: "run //:license-check"
        type: string
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private dependencies; omit when using `token`
        required: false
        default: ""
        type: string
    secrets:
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private dependencies
        required: false
      token:
        description: Token for private dependencies; an alternative to GitHub App credentials
        required: false
      dash-api-token:
        description: "Eclipse DASH API Token for license verification"
        required: true

jobs:
  license-check:
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v4.2.2
        with:
          lfs: true
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Configure access to private dependencies
        uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
        # An `if` condition cannot access secrets, so expose only their presence.
        env:
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        if: ${{ env.HAS_GH_APP_PRIVATE_KEY == 'true' || env.HAS_TOKEN == 'true' || inputs.github-app-client-id != '' }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90
        with:
          unique-cache-name: ${{ github.job }}

      - name: Run License Check via Bazel
        run: |
          set +e  # Allow execution to continue even if a command fails

          REPO_URL="${{ inputs.repo-url }}"
          if [[ -z "$REPO_URL" ]]; then
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          fi

          OUTPUT=""
          EXIT_CODE=0

          # Use org secret as fallback if dash-api-token is not provided
          TOKEN="${{ secrets.dash-api-token }}"

          CMD="bazel ${{ inputs.bazel-target }} -- -review -project automotive.score -repo $REPO_URL -token $TOKEN"
          echo "Running: $CMD"

          CHECK_OUTPUT=$($CMD 2>&1)
          CHECK_EXIT_CODE=$?

          OUTPUT="[License Check Output]\n$CHECK_OUTPUT"
          if [ $CHECK_EXIT_CODE -ne 0 ]; then
            EXIT_CODE=$CHECK_EXIT_CODE
          fi

          echo -e "$OUTPUT" | tee license-check-output.txt
          echo "exit_code=$EXIT_CODE" >> $GITHUB_ENV
          echo "output<<EOF" >> $GITHUB_ENV
          echo -e "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Find Existing Comment
        if: github.event.pull_request
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: License Check Results

      - name: Comment on PR with License Check Results
        if: github.event.pull_request
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### License Check Results
            🚀 The **license check** job ran with the Bazel command:
            ```bash
            bazel ${{ inputs.bazel-target }}
            ```

            **Status:** ${{ env.exit_code == 0 && '✅ Passed' || '⚠️ Needs Review' }}

            <details>
            <summary>Click to expand output</summary>

            ```
            ${{ env.output }}
            ```

            </details>
          reactions: eyes
          edit-mode: replace
