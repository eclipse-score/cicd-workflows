# This is the main entry point for PR checks, for all S-CORE repositories.
#
# Common checks run as a single job. Opt-in configured Bazel checks run in
# separate matrix jobs so each platform/configuration keeps its own evidence.
# Each common check step is gated with `if: ${{ !cancelled() && <capability> }}` so that:
#   - a check only runs when the repository actually has the relevant capability, and
#   - a failing check does NOT stop the checks after it (each still reports its own
#     pass/fail), while the job as a whole still fails if any step failed.
# `checkout` and the detection steps keep the default `success()` gate, so if they fail
# the capability outputs are empty and every check is skipped while the job is red.
#
# Because all checks share ONE checkout, a check that rewrites files (pre-commit,
# `bazel mod tidy`) restores the working tree afterwards with `git checkout -- .`, so
# later git-diff-based checks see the original PR state instead of the auto-fixed one.
#
# Failing checks report through the shared `report_failure` helper (see the
# "Prepare shared check helper" step), which writes actionable guidance to
# the failing step's log. Do not duplicate it in step summaries or annotations:
# both are easy to miss. They do NOT show up on the page that is linked from PRs.
# And do not write PR comments either: they require write permissions from every
# caller and cannot reliably be created for fork PRs.

# Attention: this workflow must be called with following permissions:
#    permissions:
#      contents: read

name: 🔁

on:
  workflow_call:
    # Compatibility scenarios need observations from the actual check steps.
    # Propagate the job output through the reusable workflow boundary so each
    # scenario can assert its own checkout and capability-dependent outcomes.
    outputs:
      docs-artifact:
        description: Documentation artifact name after a successful configured Docs build; empty when no Docs were built
        value: ${{ jobs.configured-docs.outputs.artifact-name }}
      quality-results:
        description: Verified analysis, SBOM and other quality evidence
        value: ${{ jobs.configured-quality.outputs.results }}
      quality-artifacts:
        description: Quality artifact names by profile ID
        value: ${{ jobs.configured-quality.outputs.artifacts }}
      check-results:
        description: JSON containing the checked-out commit and individual check outcomes
        value: ${{ jobs.pr-checks.outputs.check-results }}
      configured-results:
        description: JSON containing verified configured Bazel command outcomes
        value: ${{ jobs.verify-configured.outputs.results }}
      configured-artifacts:
        description: JSON mapping configured job identifiers to report, test-log and coverage artifact names
        value: ${{ jobs.prepare-configured.outputs.artifacts }}
    inputs:
      artifact-server-url:
        description: Optional HTTPS server for authenticated dependency downloads
        type: string
        default: ""
      qnx-license-server:
        description: Optional QNX license server
        type: string
        default: ""
      qnx-runner-labels:
        description: Optional JSON labels for QNX runners; defaults to shared runner selection
        type: string
        default: ""
      # No config means no compiler/test jobs. Existing callers keep their
      # capability-based common checks without an implicit bare Bazel build.
      workflow-config-yaml:
        description: Checkout-relative schema 2 (or supported schema 1) configuration; empty disables configured checks
        type: string
        required: false
        default: ""
      # Ordinary callers omit both checkout inputs and retain checkout's event
      # defaults. Compatibility tests select a real consumer checkout while the
      # workflow implementation still comes from the candidate PR revision.
      repository:
        description: Repository to check; defaults to the caller repository
        required: false
        default: ""
        type: string
      ref:
        description: Commit, tag or branch to check; uses checkout defaults when omitted
        required: false
        default: ""
        type: string
      skip-gitlint:
        description: "Skip PR commit-message checks when the repository has a .gitlint config"
        required: false
        default: false
        type: boolean
      skip-pre-commit:
        description: "Skip the pre-commit check even if .pre-commit-config.yaml exists"
        required: false
        default: false
        type: boolean
      skip-python-tests:
        description: "Skip the uv/pytest run even if pyproject.toml and uv.lock exist"
        required: false
        default: false
        type: boolean
      skip-format:
        description: "Skip the Bazel formatting check even if the configured target exists"
        required: false
        default: false
        type: boolean
      skip-copyright:
        description: "Skip the Bazel copyright check even if the configured target exists"
        required: false
        default: false
        type: boolean
      skip-bzlmod-lock:
        description: "Skip the Bazel bzlmod tidy/lockfile checks even if MODULE.bazel.lock exists. Cannot be combined with require-bzlmod-lock"
        required: false
        default: false
        type: boolean
      require-bzlmod-lock:
        description: "Fail if MODULE.bazel exists but MODULE.bazel.lock is missing, instead of silently skipping the lockfile checks. Cannot be combined with skip-bzlmod-lock"
        required: false
        default: false
        type: boolean
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private Bazel dependencies; omit when using `token`
        required: false
        default: ""
        type: string
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      format-target:
        description: "Formatting target override; empty discovers standard root/tools targets"
        required: false
        default: ""
        type: string
      copyright-target:
        description: "Copyright target override; empty discovers standard root/tools targets"
        required: false
        default: ""
        type: string
    secrets:
      artifact-server-user:
        description: Optional artifact server login
        required: false
      artifact-server-token:
        description: Optional artifact server token
        required: false
      qnx-license:
        description: Optional QNX license
        required: false
      qnx-user:
        description: Optional QNX portal user
        required: false
      qnx-password:
        description: Optional QNX portal password
        required: false
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private Bazel dependencies
        required: false
      token:
        description: Token for private Bazel dependencies; an alternative to GitHub App credentials
        required: false

jobs:
  pr-checks:
    name: 🔁 Common PR checks
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}

    permissions:
      contents: read

    # Expose observed outcomes for compatibility tests. A green job alone does
    # not prove a capability was detected or its check actually ran.
    outputs:
      check-results: ${{ steps.results.outputs.check-results }}

    steps:
      - name: 🚫 Refuse to run on pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "This workflow must not be called from pull_request_target."
          echo "That event has write access to repo secrets while checking out fork code,"
          echo "making it unsafe to run repository code on untrusted input."
          echo "Use pull_request or merge_group instead."
          exit 1

      - name: 🚫 Reject conflicting lockfile inputs
        if: ${{ inputs.require-bzlmod-lock && inputs.skip-bzlmod-lock }}
        run: |
          echo "::error::'require-bzlmod-lock' and 'skip-bzlmod-lock' are mutually exclusive. Set only one of them."
          exit 1

      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: 📥 Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Repository/ref are checkout inputs, never interpolated shell code.
          # Leaving ref empty preserves checkout's normal event-ref handling
          # for the caller, or its default branch for an external repository.
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: 🧰 Prepare shared check helper
        if: ${{ !cancelled() }}
        run: |
          # Shared helper sourced by every check below. A failing check calls
          # `report_failure "<title>"` and pipes the Markdown guidance in via a
          # heredoc. It writes the guidance to the failing step's log, which is
          # where the failed check opens when you click "Details".
          cat > "$RUNNER_TEMP/pr-check-lib.sh" <<'LIB'
          run_grouped() {
            local title="$1"
            shift

            echo "::group::$title"
            "$@"
            local status=$?
            echo "::endgroup::"
            return "$status"
          }

          # Runs a boolean-style check function, writes it to GITHUB_OUTPUT and
          # echoes the result so the detection is visible in the step log.
          emit_output() {
            local name="$1"
            shift

            local value
            if "$@"; then
              value=true
            else
              value=false
            fi

            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "  $name=$value"
          }

          report_failure() {
            local title="$1"
            local body
            # Read the heredoc body from stdin and strip the indentation shared by
            # all non-blank lines, so callers can indent the Markdown block for
            # readability without it being rendered as a code block (4+ spaces).
            body="$(awk '
              { line[NR] = $0 }
              /[^[:space:]]/ { match($0, /^[[:space:]]*/); if (min == "" || RLENGTH < min) min = RLENGTH }
              END { for (i = 1; i <= NR; i++) print substr(line[i], min + 1) }
            ')"
            printf '❌ %s\n\n%s\n' "$title" "$body"
            exit 1
          }
          LIB

      - name: 🕵️ Detect repository capabilities
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_REPOSITORY: ${{ inputs.repository }}
          CHECK_REF: ${{ inputs.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pr-check-lib.sh"

          echo "Detected repository capabilities:"

          # Returns success if any provided file path exists.
          any_file_exists() {
            local path
            for path in "$@"; do
              [[ -f "$path" ]] && return 0
            done
            return 1
          }

          # Returns success only if every provided file path exists.
          all_files_exist() {
            local path
            for path in "$@"; do
              [[ -f "$path" ]] || return 1
            done
            return 0
          }

          # Event commits apply only to the caller's unmodified PR checkout.
          # An explicit ref/repository selects independent source history.
          has_pr_commits() {
            [[ "$EVENT_NAME" == pull_request && -z "$CHECK_REF" &&
               ( -z "$CHECK_REPOSITORY" || "$CHECK_REPOSITORY" == "$CALLER_REPOSITORY" ) ]]
          }
          emit_output has_pr_commits has_pr_commits
          has_gitlint() {
            has_pr_commits && [[ -f .gitlint ]]
          }
          emit_output has_gitlint has_gitlint

          emit_output has_bazel any_file_exists \
            "MODULE.bazel" \
            "WORKSPACE" \
            "WORKSPACE.bazel"
          emit_output has_bzlmod any_file_exists \
            "MODULE.bazel"
          emit_output has_bazel_lock any_file_exists \
            "MODULE.bazel.lock"
          emit_output has_devcontainer any_file_exists \
            ".devcontainer/devcontainer.json" \
            "devcontainer.json"
          emit_output has_python_uv all_files_exist \
            "pyproject.toml" \
            "uv.lock"
          emit_output has_precommit any_file_exists \
            ".pre-commit-config.yaml"

      # This is the common, opt-in credential handoff used by workflows that
      # need private Bazel dependencies. It must run before pre-commit because
      # pre-commit hooks may invoke Bazel.
      - uses: eclipse-score/cicd-workflows/.github/actions/build-environment@central-workflow
        if: ${{ !cancelled() && steps.detect.outputs.has_bazel == 'true' }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}
          artifact-server-url: ${{ inputs.artifact-server-url }}
          artifact-server-user: ${{ secrets.artifact-server-user }}
          artifact-server-token: ${{ secrets.artifact-server-token }}

      - name: ⚙️ Setup Bazel with shared caching
        if: ${{ !cancelled() && steps.detect.outputs.has_bazel == 'true' }}
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          # Separate consumer caches while preserving ordinary callers' keys.
          disk-cache-key: ${{ inputs.repository != '' && format('{0}-{1}', github.job, inputs.repository) || github.job }}
          # An external checkout has its own history. Caller event SHAs cannot
          # decide whether its lockfile changed, so restore caches explicitly.
          disk-cache-restore: ${{ (inputs.repository != '' || inputs.ref != '') && 'true' || 'auto' }}
          repository-cache-restore: ${{ (inputs.repository != '' || inputs.ref != '') && 'true' || 'auto' }}

      - name: ⚙️ Setup uv
        if: ${{ !cancelled() && (steps.detect.outputs.has_precommit == 'true' || steps.detect.outputs.has_python_uv == 'true' || steps.detect.outputs.has_gitlint == 'true') }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: 💬 Check PR commit messages
        id: gitlint
        if: ${{ !cancelled() && steps.detect.outputs.has_gitlint == 'true' && !inputs.skip-gitlint }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pr-check-lib.sh"

          # Event SHAs select the actual PR commits, including on fork PRs.
          # Checkout's synthetic merge commit is deliberately outside the range.
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          fetch_options=(--no-tags)
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            fetch_options+=(--unshallow)
          fi
          git fetch "${fetch_options[@]}" origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          commit_range="$PR_BASE_SHA..$PR_HEAD_SHA"
          if [[ -z "$(git rev-list "$commit_range")" ]]; then
            report_failure "No PR commits found for Gitlint" <<'MD'
              The PR base and head did not select any commits. Re-run against the current PR revision.
          MD
          fi

          # Pin the shared policy independently of the checked-out module.
          # Keeping it outside the checkout avoids changing other checks' inputs.
          if ! run_grouped "PR commit messages" uvx --from gitlint==0.19.1 gitlint --config .gitlint --commits "$commit_range"; then
            report_failure "PR commit messages do not follow the repository Gitlint configuration" <<'MD'
              Review the Gitlint errors above and the commit-message guidelines:
              https://eclipse-score.github.io/score/main/contribute/general/git.html#commit-message-format

              **Reproduce locally**
              Run `uvx --from gitlint==0.19.1 gitlint --config .gitlint --commits <base-sha>..<head-sha>`.

              **Fix**
              Edit the affected commit messages and update your PR branch.
          MD
          fi

      - name: 🧹 Run pre-commit checks
        id: pre-commit
        if: ${{ !cancelled() && steps.detect.outputs.has_precommit == 'true' && !inputs.skip-pre-commit }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          if ! run_grouped "pre-commit checks" uvx pre-commit run --all-files; then
            # pre-commit auto-fixes files in place, and only reports failure when it
            # changed something. Restore the working tree so later git-diff-based
            # checks (e.g. `bazel mod tidy`) see the original PR state, not the fixes.
            git checkout -- . >/dev/null
            report_failure "pre-commit failed" <<'MD'
              One or more pre-commit hooks reported problems (formatting, linting, etc.).

              **Reproduce locally**
              ```bash
              uvx pre-commit run --all-files
              ```

              **Fix**
              Most hooks auto-fix. Re-run the command above, review the changes it made, then commit them.
              Run `uvx pre-commit install` once to catch this before pushing.
          MD
          fi

      - name: 🐍 Run Python tests with uv
        id: python-tests
        if: ${{ !cancelled() && steps.detect.outputs.has_python_uv == 'true' && !inputs.skip-python-tests }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          if ! run_grouped "Python tests" uv run --frozen python -m pytest; then
            report_failure "Python tests failed" <<'MD'
              Tests failed, or `uv.lock` is out of date (`--frozen` forbids updating it during the run).

              **Reproduce locally**
              ```bash
              uv run --frozen python -m pytest
              ```

              **Fix**
              Fix the failing tests. If the failure is about the lockfile, run `uv lock` and commit the updated `uv.lock`.
          MD
          fi

      - name: 📝 Check Bazel module name
        # The script to detect the module name is broken; kept disabled (&& false) until fixed.
        if: ${{ !cancelled() && steps.detect.outputs.has_bazel == 'true' && false }}
        run: |
          if ! MODULE_LINE=$(grep '^module(' MODULE.bazel | head -1); then
            echo "❌ No module declaration found in MODULE.bazel"
            exit 1
          fi

          MODULE_NAME=$(echo "$MODULE_LINE" | sed 's/^module([[:space:]]*name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/' | sed 's/^module([[:space:]]*"\([^"]*\)".*/\1/')

          if [[ -z "$MODULE_NAME" || "$MODULE_NAME" == "$MODULE_LINE" ]]; then
            MODULE_NAME=$(echo "$MODULE_LINE" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          fi

          echo "Found module name: $MODULE_NAME"

          if [[ ! "$MODULE_NAME" =~ ^score_[[:lower:]_]+$ ]]; then
            echo "❌ Invalid module name: $MODULE_NAME"
            echo "Module name must match the pattern: ^score_[[:lower:]_]+$"
            echo "  - Must start with 'score_'"
            echo "  - Must contain only lowercase letters and underscores after 'score_'"
            echo "Examples of valid names: score_cli, score_compose, score_web_api"
            exit 1
          fi

          echo "✅ Module name is valid: $MODULE_NAME"
      - name: 🕵️ Detect Bazel targets
        id: bazel
        if: ${{ !cancelled() && steps.detect.outputs.has_bazel == 'true' }}
        env:
          FORMAT_TARGET: ${{ inputs.format-target }}
          COPYRIGHT_TARGET: ${{ inputs.copyright-target }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pr-check-lib.sh"

          echo "Detected Bazel targets:"

          # Explicit overrides select one target. Otherwise discover the public
          # entry points used by SCORE modules, preferring root targets. Query
          # each candidate independently so one absent label cannot mask another.
          select_target() {
            local output="$1" configured="$2"
            shift 2
            local candidates=("$@") target
            if [[ -n "$configured" ]]; then
              candidates=("$configured")
            fi
            for target in "${candidates[@]}"; do
              if bazel query "$target" >/dev/null 2>&1; then
                printf '%s=%s\n' "$output" "$target" >> "$GITHUB_OUTPUT"
                printf '  %s=%s\n' "$output" "$target"
                return
              fi
            done
            printf '%s=\n' "$output" >> "$GITHUB_OUTPUT"
          }

          select_target format-target "$FORMAT_TARGET" //:format.check //tools:format.check
          select_target copyright-target "$COPYRIGHT_TARGET" \
            //:copyright.check //tools:copyright.check //:copyright-check //tools:copyright-check

      - name: 🖌️ Run bazel formatting check
        id: format
        if: ${{ !cancelled() && steps.bazel.outputs.format-target != '' && !inputs.skip-format }}
        env:
          FORMAT_TARGET: ${{ steps.bazel.outputs.format-target }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          if ! run_grouped "bazel test $FORMAT_TARGET" bazel test "$FORMAT_TARGET"; then
            report_failure "Formatting check failed" <<MD
              \`$FORMAT_TARGET\` found files that are not formatted according to the project formatting rules.

              **Reproduce locally**
              \`\`\`bash
              bazel test $FORMAT_TARGET
              \`\`\`

              **Fix**
              Run the repository's formatter, then commit the updated sources.
          MD
          fi

      - name: © Run bazel copyright check
        id: copyright
        if: ${{ !cancelled() && steps.bazel.outputs.copyright-target != '' && !inputs.skip-copyright }}
        env:
          COPYRIGHT_TARGET: ${{ steps.bazel.outputs.copyright-target }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          if ! run_grouped "bazel run $COPYRIGHT_TARGET" bazel run "$COPYRIGHT_TARGET"; then
            report_failure "Copyright check failed" <<MD
              One or more source files are missing the required copyright/license header.

              **Reproduce locally**
              \`\`\`bash
              bazel run $COPYRIGHT_TARGET
              \`\`\`

              **Fix**
              Add the missing headers using the repository's copyright tooling, then commit the updated sources.
          MD
          fi

      - name: 🔒 Require Bazel lockfile
        id: require-lock
        if: ${{ !cancelled() && inputs.require-bzlmod-lock && steps.detect.outputs.has_bzlmod == 'true' && steps.detect.outputs.has_bazel_lock != 'true' }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          report_failure "Bazel lockfile is missing" <<'MD'
            `MODULE.bazel.lock` is required (`require-bzlmod-lock: true`) but does not exist.

            **Fix**
            Run `bazel mod tidy` and commit the generated `MODULE.bazel.lock`.
            Make sure it is not listed in `.gitignore`.
          MD

      - name: 🔒 Check Bazel module is tidy
        id: module-tidy
        if: ${{ !cancelled() && steps.detect.outputs.has_bazel_lock == 'true' && !inputs.skip-bzlmod-lock }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          if ! (
            echo "::group::bazel mod tidy and lockfile diff"
            bazel mod tidy && git diff --exit-code
            status=$?
            echo "::endgroup::"
            exit "$status"
          ); then
            # bazel mod tidy rewrites MODULE.bazel / MODULE.bazel.lock in place;
            # restore them so the lockfile check below sees the original PR state.
            git checkout -- . >/dev/null
            report_failure "Bazel module is not tidy" <<'MD'
              `bazel mod tidy` would change `MODULE.bazel` or `MODULE.bazel.lock`, so they are not tidy.

              **Reproduce locally**
              ```bash
              bazel mod tidy && git diff
              ```

              **Fix**
              Run `bazel mod tidy` and commit the resulting changes to `MODULE.bazel` / `MODULE.bazel.lock`.
          MD
          fi

      - name: 🔒 Check Bazel lockfile is up to date
        id: lockfile
        if: ${{ !cancelled() && steps.detect.outputs.has_bazel_lock == 'true' && !inputs.skip-bzlmod-lock }}
        run: |
          source "$RUNNER_TEMP/pr-check-lib.sh"

          if [ ! -f "MODULE.bazel" ]; then
            echo "MODULE.bazel not found in $PWD"
            exit 1
          fi

          if [ ! -f "MODULE.bazel.lock" ]; then
            echo "MODULE.bazel.lock is missing. Run: bazel mod tidy"
            exit 1
          fi

          if ! run_grouped "bazel mod deps --lockfile_mode=error" bazel mod deps --lockfile_mode=error; then
            report_failure "Bazel lockfile is out of date" <<'MD'
              `MODULE.bazel.lock` does not match the resolved dependency graph.

              **Reproduce locally**
              ```bash
              bazel mod deps --lockfile_mode=error
              ```

              **Fix**
              Regenerate the lockfile with `bazel mod tidy` and commit the updated `MODULE.bazel.lock`.
          MD
          fi

      # Publish observations even after a failed check. Use outcome (before any
      # continue-on-error handling), and preserve skipped as a distinct result.
      # Returning JSON avoids artifacts and extra permissions for consumer tests.
      # cancelled() is a status function, so !cancelled() already suppresses the
      # implicit success() gate and keeps reporting after earlier check failures.
      - name: Report individual check outcomes
        id: results
        if: ${{ !cancelled() }}
        env:
          CHECK_STEPS: ${{ toJSON(steps) }}
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
        shell: python
        run: |
          import json
          import os

          # The steps context includes skipped checks as well as executed ones.
          # Keep the full named set so consumers can distinguish an intentional
          # skip from a capability that unexpectedly stopped being detected.
          steps = json.loads(os.environ['CHECK_STEPS'])
          names = ('gitlint', 'pre-commit', 'python-tests', 'format', 'copyright',
                   'require-lock', 'module-tidy', 'lockfile')

          results = {
              'commit': os.environ['SOURCE_SHA'],
              'checks': {name: steps[name]['outcome'] for name in names},
          }

          # Report checkout's observed commit, not the requested ref. An input
          # echo would claim the right source even if checkout selected another
          # revision. Single-line JSON passes intact through GitHub job outputs.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('check-results=' + json.dumps(results) + '\n')

  # Preparation freezes the checkout before expanding the matrix. A moving
  # branch must not produce a plan from one commit and evidence from another.
  prepare-configured:
    name: Plan configured Bazel checks
    if: ${{ inputs.workflow-config-yaml != '' && github.event_name != 'pull_request_target' }}
    timeout-minutes: 10
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      artifact-prefix: ${{ steps.plan.outputs.artifact-prefix }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      has-checks: ${{ steps.plan.outputs.has-checks }}
      docs: ${{ steps.plan.outputs.docs }}
      source-commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          lfs: true
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      # Experimental branch reference shared with the consumer workflows.
      # A release must pin this action and the reusable workflow together.
      - uses: eclipse-score/cicd-workflows/.github/actions/configured-checks@central-workflow
        id: plan
        with:
          mode: plan
          repository: ${{ inputs.repository || github.repository }}
          config: ${{ inputs.workflow-config-yaml }}
          reports: ${{ runner.temp }}/configured-checks

  configured:
    name: Bazel / ${{ matrix.id }}
    # Full module graphs and emulation need more time than focused smoke tests.
    # QEMU's longest test timeout fits within GitHub's six-hour job budget.
    timeout-minutes: ${{ matrix.execution != 'native' && 360 || 120 }}
    needs: prepare-configured
    if: ${{ needs.prepare-configured.outputs.has-checks == 'true' }}
    runs-on: ${{ matrix.platform.os == 'qnx' && (inputs.qnx-runner-labels && fromJSON(inputs.qnx-runner-labels) || vars.runner_labels_ghub24_large_x64 && fromJSON(vars.runner_labels_ghub24_large_x64)) || inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    strategy:
      # A failing native row must not hide the cross-compiler's result.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-configured.outputs.matrix) }}
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.prepare-configured.outputs.source-commit }}

      - uses: eclipse-score/cicd-workflows/.github/actions/build-environment@central-workflow
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}
          artifact-server-url: ${{ inputs.artifact-server-url }}
          artifact-server-user: ${{ secrets.artifact-server-user }}
          artifact-server-token: ${{ secrets.artifact-server-token }}
          qnx: ${{ matrix.platform.os == 'qnx' }}
          qnx-license: ${{ secrets.qnx-license }}
          qnx-user: ${{ secrets.qnx-user }}
          qnx-password: ${{ secrets.qnx-password }}
          qnx-license-server: ${{ inputs.qnx-license-server }}
          execution: ${{ matrix.execution }}
          architecture: ${{ matrix.platform.architecture }}
          profile: ${{ matrix.prerequisites || '' }}

      # Nested-workspace support, merged in eclipse-score/cicd-actions#74.
      - uses: eclipse-score/cicd-actions/setup-bazel-cache@ee1eb410c572e2a97ae27488f8401887ec331de3
        with:
          disk-cache-key: ${{ format('configured-{0}-{1}', inputs.repository || github.repository, matrix.id) }}
          working-directory: ${{ matrix.working-directory }}
          # The pinned preparation SHA is independent of caller event history.
          disk-cache-restore: 'true'
          repository-cache-restore: 'true'
          # The executor owns BEP files to prove every planned command ran.
          # The action's test-hit reporter would otherwise inject a second BEP
          # destination and overwrite the executor's evidence flag.
          report-test-cache-hits: 'false'

      - uses: eclipse-score/cicd-workflows/.github/actions/configured-checks@central-workflow
        with:
          mode: run
          config: ${{ inputs.workflow-config-yaml }}
          job: ${{ matrix.id }}
          reports: ${{ runner.temp }}/configured-checks

      # Retain partial evidence after failures too. Each matrix job uploads only
      # its own directory; concurrent invocations use unique artifact prefixes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ needs.prepare-configured.outputs.artifact-prefix }}-report-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/configured-checks/${{ matrix.id }}/report.json
            ${{ runner.temp }}/configured-checks/${{ matrix.id }}/*.bep.jsonl
          if-no-files-found: error
          retention-days: 7

      # Keep package-relative XML/log paths at the archive root. Documentation
      # derives Bazel labels from those paths, so a report/testlogs prefix would
      # change the meaning of otherwise identical test results.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.has-tests }}
        with:
          name: ${{ needs.prepare-configured.outputs.artifact-prefix }}-testlogs-${{ matrix.id }}
          path: ${{ runner.temp }}/configured-checks/${{ matrix.id }}/testlogs/
          # Setup/build failures may prevent any tests from starting. Their
          # failed job/report remains authoritative; no empty log archive is made.
          if-no-files-found: ignore
          retention-days: 7

      # Coverage archives retain their consumer-facing names when required by
      # release workflows. Execution evidence remains invocation-specific.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.coverage }}
        with:
          name: ${{ fromJSON(needs.prepare-configured.outputs.artifacts)[matrix.id].coverage }}
          path: ${{ runner.temp }}/configured-checks/${{ matrix.id }}/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ matrix.coverage.retention-days }}

  verify-configured:
    name: Verify configured Bazel checks
    timeout-minutes: 10
    needs: [prepare-configured, configured]
    if: ${{ !cancelled() && inputs.workflow-config-yaml != '' && github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      results: ${{ steps.verify.outputs.results }}
    steps:
      # A stable gate must fail on invalid configuration too, rather than being
      # skipped when preparation fails before a matrix can be generated.
      - name: Require successful preparation
        if: ${{ needs.prepare-configured.result != 'success' }}
        run: |
          echo "::error::Configured checks could not be planned. See preparation logs."
          exit 1

      # Separate download directories preserve duplicate reports, which must
      # fail verification rather than silently overwriting each other.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.prepare-configured.outputs.has-checks == 'true' }}
        with:
          pattern: ${{ needs.prepare-configured.outputs.artifact-prefix }}-report-*
          path: ${{ runner.temp }}/configured-checks

      - uses: eclipse-score/cicd-workflows/.github/actions/configured-checks@central-workflow
        id: verify
        if: ${{ needs.prepare-configured.outputs.has-checks == 'true' }}
        with:
          mode: verify
          expected: ${{ needs.prepare-configured.outputs.expected }}
          source-commit: ${{ needs.prepare-configured.outputs.source-commit }}
          reports: ${{ runner.temp }}/configured-checks

      # Cache/action post steps can fail after successful command reports were
      # uploaded. Keep that failure visible in the stable verification gate.
      - name: Require successful matrix jobs
        if: ${{ !cancelled() && needs.prepare-configured.outputs.has-checks == 'true' && needs.configured.result != 'success' }}
        run: |
          echo "::error::At least one configured job failed. See its setup, execution and post-step logs."
          exit 1

  configured-quality:
    name: Configured quality
    needs: prepare-configured
    uses: ./.github/workflows/configured-quality.yml
    with:
      artifact-server-url: ${{ inputs.artifact-server-url }}
      qnx-license-server: ${{ inputs.qnx-license-server }}
      qnx-runner-labels: ${{ inputs.qnx-runner-labels }}
      github-app-client-id: ${{ inputs.github-app-client-id }}
      config: ${{ inputs.workflow-config-yaml }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ needs.prepare-configured.outputs.source-commit }}
      runner-labels: ${{ inputs.runner-labels }}

    secrets:
      token: ${{ secrets.token }}
      github-app-private-key: ${{ secrets.github-app-private-key }}
      artifact-server-user: ${{ secrets.artifact-server-user }}
      artifact-server-token: ${{ secrets.artifact-server-token }}
      qnx-license: ${{ secrets.qnx-license }}
      qnx-user: ${{ secrets.qnx-user }}
      qnx-password: ${{ secrets.qnx-password }}

  # Documentation retains failed test results from the same frozen checkout.
  # Publishing remains a separate consumer decision with separate permissions.
  configured-docs:
    name: Configured documentation
    needs: [prepare-configured, verify-configured]
    if: ${{ !cancelled() && needs.prepare-configured.result == 'success' && needs.prepare-configured.outputs.docs != '{}' && needs.prepare-configured.outputs.docs != '' }}
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
    with:
      artifact-server-url: ${{ inputs.artifact-server-url }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ needs.prepare-configured.outputs.source-commit }}
      bazel-label: ${{ fromJSON(needs.prepare-configured.outputs.docs).bazel-target }}
      retention-days: ${{ fromJSON(needs.prepare-configured.outputs.docs).retention-days }}
      allow-missing-reports: true
      tests-report-artifact: ${{ fromJSON(needs.prepare-configured.outputs.docs).tests-artifact }}
      tests-report-artifacts: ${{ toJSON(fromJSON(needs.prepare-configured.outputs.docs).tests-artifacts) }}
      coverage-report-artifact: ${{ fromJSON(needs.prepare-configured.outputs.docs).coverage-artifact }}
      runner-labels: ${{ inputs.runner-labels }}
      gh_app_client_id: ${{ inputs.github-app-client-id }}
    secrets:
      artifact-server-user: ${{ secrets.artifact-server-user }}
      artifact-server-token: ${{ secrets.artifact-server-token }}
      token: ${{ secrets.token }}
      gh_app_private_key: ${{ secrets.github-app-private-key }}
