name: Static Code Analysis

on:
  workflow_call:
    inputs:
      bazel-targets:
        description: "Bazel targets to build (default: //...)"
        required: false
        default: "//..."
        type: string
      bazel-config:
        description: "Bazel config to apply (default: lint). Set empty to disable."
        required: false
        default: "lint"
        type: string
      bazel-args:
        description: "Extra Bazel args to pass to the build command"
        required: false
        default: ""
        type: string
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private dependencies; omit when using `token`
        required: false
        default: ""
        type: string
    secrets:
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private dependencies
        required: false
      token:
        description: Token for private dependencies; an alternative to GitHub App credentials
        required: false

jobs:
  static-analysis:
    name: Static Code Analysis
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          lfs: true

      - name: Configure access to private dependencies
        uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
        # An `if` condition cannot access secrets, so expose only their presence.
        env:
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        if: ${{ env.HAS_GH_APP_PRIVATE_KEY == 'true' || env.HAS_TOKEN == 'true' || inputs.github-app-client-id != '' }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90
        with:
          unique-cache-name: ${{ github.job }}

      - name: Run Clippy via Bazel build
        id: bazel-build
        continue-on-error: true
        run: |
          set -uo pipefail
          config_flag=""
          if [ -n "${{ inputs.bazel-config }}" ]; then
            config_flag="--config=${{ inputs.bazel-config }}"
          fi
          echo "Running: bazel build ${config_flag} ${{ inputs.bazel-args }} ${{ inputs.bazel-targets }}"
          bazel build ${config_flag} ${{ inputs.bazel-args }} ${{ inputs.bazel-targets }}
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "${exit_code}" != "0" ]; then
            echo "Bazel build failed with exit code ${exit_code}"
          fi

      - name: Collect Clippy reports
        id: collect
        if: always()
        run: |
          set -euo pipefail
          mkdir -p clippy-reports
          mapfile -d '' files < <(find -L bazel-bin -type f -name '*.AspectRulesLintClippy.out' -print0 || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Clippy reports found."
            echo "clippy_report_count=0" >> "$GITHUB_OUTPUT"
            echo "clippy_issue_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in "${files[@]}"; do
            dest="clippy-reports/${f#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

          issues=$(find -L bazel-bin -type f -name '*.AspectRulesLintClippy.out' -size +0c | wc -l | tr -d ' ')
          echo "clippy_report_count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "clippy_issue_count=${issues}" >> "$GITHUB_OUTPUT"
          tar -czf clippy-reports.tar.gz -C clippy-reports .

      - name: Upload Clippy reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: clippy-reports
          path: |
            clippy-reports.tar.gz
            clippy-reports
          if-no-files-found: warn

      - name: Clippy summary
        if: always()
        run: |
          {
            echo "### Clippy report summary"
            echo "- Targets: ${{ inputs.bazel-targets }}"
            echo "- Config: ${{ inputs.bazel-config }}"
            echo "- Total report files: ${{ steps.collect.outputs.clippy_report_count }}"
            echo "- Non-empty reports: ${{ steps.collect.outputs.clippy_issue_count }}"
            echo "- Bazel exit code: ${{ steps.bazel-build.outputs.exit_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if build or Clippy issues found
        if: always()
        run: |
          exit_code="${{ steps.bazel-build.outputs.exit_code }}"
          issues="${{ steps.collect.outputs.clippy_issue_count }}"

          if [ "${exit_code}" != "0" ]; then
            echo "Bazel build failed with exit code ${exit_code}"
          fi
          if [ "${issues}" != "0" ]; then
            echo "Clippy issues found: ${issues}"
          fi

          if [ "${exit_code}" != "0" ] || [ "${issues}" != "0" ]; then
            exit 1
          fi
