name: Daily Maintenance Tasks

# This workflow is designed to run daily and perform maintenance tasks such as
# marking and closing stale pull requests and cleaning up old documentation.
# An example how to use the workflow can be found in ./_local_daily.yml

on:
  workflow_call:
    inputs:
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string

jobs:
  stale-prs:
    name: Mark and close stale pull requests
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Review inactive pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1 # Don't mark issues as stale, only pull requests
          days-before-issue-close: -1 # Don't close issues, only pull requests
          days-before-pr-stale: 30 # 30 days idle → stale
          days-before-pr-close: 10 # 10 days after stale → close
          stale-pr-label: stale
          close-pr-label: autoclosed
          exempt-pr-labels: keep-open,do-not-close,pinned,feature_request # list to be refined
          stale-pr-message: >-
            Thanks for the pull request. This thread has been quiet for 30 days, so we are marking it
            as stale for now. Please take a quick look and let us know whether it is still up to date,
            still relevant, needs review, or is ready to merge. Any new activity will remove the stale
            label automatically. If nothing changes in the next 10 days, we will close it to keep the
            backlog current.
          close-pr-message: >-
            We are closing this pull request because it stayed stale for 10 more days without any new
            activity. If this is still relevant, please reopen it or open a fresh pull request when you
            are ready, and we will pick it up from there.
  detect-repo-capabilities:
    name: Detect repository capabilities
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pages: read
    outputs:
      should_run_docs_cleanup: ${{ steps.pages.outputs.should_run_docs_cleanup }}
    steps:
      - name: Detect whether GitHub Pages is enabled for this repository
        id: pages
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            let pages = null;
            try {
              const response = await github.rest.repos.getPages(context.repo);
              pages = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            core.setOutput("should_run_docs_cleanup", Boolean(pages) ? "true" : "false");

  docs-cleanup:
    name: Cleanup old documentation
    needs: detect-repo-capabilities
    if: needs.detect-repo-capabilities.outputs.should_run_docs_cleanup == 'true'
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository root for deploy context
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: gh-pages
          fetch-depth: 0

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: gh-pages
          fetch-depth: 0
          path: gh-pages-cleanup

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Cleanup old documentation
        working-directory: gh-pages-cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh auth status

          ACTIVE_BRANCHES=$(gh api --paginate repos/${{ github.repository }}/branches --jq '.[].name')
          OPEN_PRS=$(gh api --paginate repos/${{ github.repository }}/pulls --jq '.[] | "pr-\(.number)"')
          TAGS=$(gh api --paginate repos/${{ github.repository }}/tags --jq '.[].name')
          VALID_ENTRIES=$(echo -e "$ACTIVE_BRANCHES\n$OPEN_PRS\n$TAGS")
          CURRENT_FOLDERS=$(find . -maxdepth 1 -type d -not -name '.' -not -path './.*' -exec basename {} \;)

          if [[ -f versions.json ]]; then
            jq '.' versions.json > versions_tmp.json
          else
            echo "[]" > versions_tmp.json
          fi

          for FOLDER in $CURRENT_FOLDERS; do
            if ! echo "$VALID_ENTRIES" | grep -Fxq "$FOLDER"; then
              echo "Removing $FOLDER"
              rm -rf "$FOLDER"
              jq --arg ver "$FOLDER" 'map(select(.version != $ver))' versions_tmp.json > tmp.json && mv tmp.json versions_tmp.json
            fi
          done

          jq '[.[] | select((.version | IN($folders[])))]' --argjson folders "$(ls -1 | jq -R -s -c 'split("\n")[:-1]')" versions_tmp.json > versions_tmp_clean.json

          jq --arg repo "${{ github.repository }}" \
             --arg owner "${{ github.repository_owner }}" \
             '[.[] | select(.version != "main")]
              | sort_by(.version)
              | [{"version":"main",
                  "url":("https://" + $owner + ".github.io/" + ($repo | split("/")[1]) + "/main/")}]
              + .' \
             versions_tmp_clean.json > versions.json

          rm versions_tmp.json versions_tmp_clean.json

      - name: Commit and Push Changes
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: gh-pages-cleanup
          commit-message: "Daily cleanup of outdated documentation"

  cache-cleanup:
    name: Cleanup old caches
    permissions:
      actions: write # Required to delete GitHub Actions caches.
      contents: read
    runs-on: ${{ vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || 'ubuntu-latest' }}
    steps:
      - name: Prune obsolete cache generations
        uses: eclipse-score/cicd-actions/prune-cache@8e69f47b45778afd3b0d069c0456184c4ceeffe7 # prune-cache/v0.0.0
