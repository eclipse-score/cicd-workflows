name: Daily Maintenance Tasks

# This workflow is designed to run daily and perform maintenance tasks such as
# marking and closing stale pull requests, cleaning up old documentation and
# checking the documentation for dead links.
# An example how to use the workflow can be found in ./_local_daily.yml

on:
  workflow_call:
    inputs:
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private dependencies; omit when using `token`
        required: false
        default: ""
        type: string
      skip-stale-prs:
        description: Set to true to skip marking and closing stale pull requests
        required: false
        default: false
        type: boolean
      skip-docs-link-check:
        description: Set to true to skip the documentation dead link check
        required: false
        default: false
        type: boolean
    secrets:
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private dependencies
        required: false
      token:
        description: Token for private dependencies; an alternative to GitHub App credentials
        required: false

jobs:
  stale-prs:
    name: Mark and close stale pull requests
    if: ${{ !inputs.skip-stale-prs }}
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Review inactive pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1 # Don't mark issues as stale, only pull requests
          days-before-issue-close: -1 # Don't close issues, only pull requests
          days-before-pr-stale: 30 # 30 days idle → stale
          days-before-pr-close: 10 # 10 days after stale → close
          stale-pr-label: stale
          close-pr-label: autoclosed
          exempt-pr-labels: keep-open,do-not-close,pinned,feature_request # list to be refined
          stale-pr-message: >-
            Thanks for the pull request. This thread has been quiet for 30 days, so we are marking it
            as stale for now. Please take a quick look and let us know whether it is still up to date,
            still relevant, needs review, or is ready to merge. Any new activity will remove the stale
            label automatically. If nothing changes in the next 10 days, we will close it to keep the
            backlog current.
          close-pr-message: >-
            We are closing this pull request because it stayed stale for 10 more days without any new
            activity. If this is still relevant, please reopen it or open a fresh pull request when you
            are ready, and we will pick it up from there.
  detect-repo-capabilities:
    name: Detect repository capabilities
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pages: read
    outputs:
      should_run_docs_cleanup: ${{ steps.pages.outputs.should_run_docs_cleanup }}
    steps:
      - name: Detect whether GitHub Pages is enabled for this repository
        id: pages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            let pages = null;
            try {
              const response = await github.rest.repos.getPages(context.repo);
              pages = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            core.setOutput("should_run_docs_cleanup", Boolean(pages) ? "true" : "false");

  docs-cleanup:
    name: Cleanup old documentation
    needs: detect-repo-capabilities
    if: needs.detect-repo-capabilities.outputs.should_run_docs_cleanup == 'true'
    uses: ./.github/workflows/_docs-cleanup.yml
    # Forward the private-dependency credentials so the called workflow can
    # configure inter-repo access too.
    with:
      github-app-client-id: ${{ inputs.github-app-client-id }}
    secrets:
      github-app-private-key: ${{ secrets.github-app-private-key }}
      token: ${{ secrets.token }}
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write

  docs-link-check:
    name: Check documentation for dead links
    needs: detect-repo-capabilities
    # Only repositories that publish documentation (GitHub Pages enabled) are checked.
    if: ${{ !inputs.skip-docs-link-check && needs.detect-repo-capabilities.outputs.should_run_docs_cleanup == 'true' }}
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write # Required to create or update the "Broken Documentation Links" issue.
    steps:
      - uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
        # Hint: if condition cannot access secrets, so we pass them via env
        env:
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        if: ${{ env.HAS_GH_APP_PRIVATE_KEY == 'true' || env.HAS_TOKEN == 'true' || inputs.github-app-client-id != '' }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}

      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Checks out the repository, runs `bazel run //:docs_link_check` and
      # creates or updates an issue listing the broken links it found.
      - name: Run docs-as-code link check
        uses: eclipse-score/docs-as-code/.github/actions/link-check@6a19771a59036997daa28e2520a33a3fa2f78ebe # v8.5.1
        with:
          github-token: ${{ github.token }}

  cache-cleanup:
    name: Cleanup old caches
    permissions:
      actions: write # Required to delete GitHub Actions caches.
      contents: read
    runs-on: ${{ vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || 'ubuntu-latest' }}
    steps:
      - name: Prune obsolete cache generations
        uses: eclipse-score/cicd-actions/prune-cache@8e69f47b45778afd3b0d069c0456184c4ceeffe7 # prune-cache/v0.0.0
