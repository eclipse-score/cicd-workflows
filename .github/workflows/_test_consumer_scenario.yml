# One invocation represents one catalog entry: run the candidate workflow,
# then verify that it checked the pinned source and performed the expected work.
# Keeping both jobs in this wrapper makes each matrix row independently fail
# when its observations differ from its expectations.
name: Consumer compatibility scenario

on:
  workflow_call:
    inputs:
      repository:
        description: Public consumer repository from the shared catalog
        type: string
        required: true
      ref:
        description: Full consumer commit SHA, pinned for reproducible PR runs
        type: string
        required: true
      required-checks:
        description: JSON list of checks that must run successfully
        type: string
        required: true
      # Preparation reads defaults from the candidate workflow and applies
      # validated catalog overrides. No default values are duplicated here:
      # regressions in ordinary calls must also break compatibility scenarios.
      check-inputs:
        description: JSON object of candidate defaults with documented consumer overrides
        type: string
        required: true

permissions:
  contents: read

jobs:
  # A relative call executes the workflow from this PR/merge commit. Only its
  # source checkout changes; check settings use defaults unless the catalog
  # explicitly documents overrides in its entry.
  checks:
    uses: ./.github/workflows/on-pr.yml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      # Forward resolved values directly. In particular, a false override must
      # remain false even when the candidate's default for that input is true.
      format-target: ${{ fromJSON(inputs.check-inputs).format-target }}
      copyright-target: ${{ fromJSON(inputs.check-inputs).copyright-target }}
      skip-pre-commit: ${{ fromJSON(inputs.check-inputs).skip-pre-commit }}
      skip-python-tests: ${{ fromJSON(inputs.check-inputs).skip-python-tests }}
      skip-format: ${{ fromJSON(inputs.check-inputs).skip-format }}
      skip-copyright: ${{ fromJSON(inputs.check-inputs).skip-copyright }}
      skip-bzlmod-lock: ${{ fromJSON(inputs.check-inputs).skip-bzlmod-lock }}

  # A separate wrapper per scenario preserves that call's outputs. Reading
  # outputs from a reusable-workflow matrix directly would retain just one
  # completed invocation and could hide missing checks in the other consumers.
  verify:
    # Retain the default success condition: a failed consumer workflow already
    # fails this scenario. Assertions add coverage for successful calls that
    # skipped expected work; they do not turn failed checks into expected passes.
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      # The assertion helper belongs to this candidate, so checkout stays on the
      # caller PR/merge revision rather than the consumer revision checked above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Require the pinned checkout and expected checks
        env:
          ACTUAL: ${{ needs.checks.outputs.check-results }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
          SOURCE_SHA: ${{ inputs.ref }}
        run: uv run --locked python tests/ci/consumers.py verify
