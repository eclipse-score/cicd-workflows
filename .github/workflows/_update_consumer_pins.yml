# Keep reproducible consumer snapshots current without maintaining their SHAs
# by hand. Resolve once, test that exact catalog, then attempt a normal main
# push. Incompatible consumers or a rejected push become a reviewable PR.
name: Update consumer pins

on:
  schedule:
    - cron: '43 4 * * *' # Daily, away from the busy start of the hour (UTC).
  workflow_dispatch:

# Serialize updates so two runs do not publish different candidates at once.
# A concurrent human change on main is still protected by the non-forced push.
concurrency:
  group: update-consumer-pins
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Publishing belongs to the upstream default branch, not forks or manually
    # selected feature branches. github.sha pins the implementation being tested.
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      matrix: ${{ steps.update.outputs.matrix }}
      artifact-id: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Resolve current consumer default branches
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python tests/ci/update_consumers.py

      - name: Validate the candidate catalog and updater
        run: uv run --locked python -m pytest -v

      # Pass the edited file to publishing separately from matrix job outputs:
      # a reusable-workflow matrix retains only one invocation's output values.
      - id: snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.changed == 'true'
        with:
          name: consumer-pin-update-${{ github.run_attempt }}
          path: .github/ci/consumers.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Reuse the PR suite's scenario wrapper: require overall workflow success,
  # the exact checkout SHA and every required check in the candidate profile.
  # No write token is passed to jobs executing consumer repository code.
  consumers:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_test_consumer_scenario.yml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      required-checks: ${{ matrix.required-checks }}
      check-inputs: ${{ matrix.check-inputs }}

  publish:
    needs: [prepare, consumers]
    # Failed compatibility checks must reach the PR fallback. Cancelled runs
    # publish nothing, and preparation failures cannot publish a partial update.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' && (needs.consumers.result == 'success' || needs.consumers.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Use the existing Renovate bot credential for publishing. A fallback PR
      # must trigger normal PR checks without requiring approval of a token-
      # generated workflow run. Consumers never receive this credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.SCORE_BOT_CLASSIC_PAT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A partial rerun keeps prepare's original outputs. Its artifact may
          # belong to an earlier attempt, so use its ID rather than today's name.
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: .github/ci

      - name: Push verified pins to main
        id: push
        if: needs.consumers.result == 'success'
        continue-on-error: true
        run: |
          git config user.name "eclipse-score-bot"
          git config user.email "187756813+eclipse-score-bot@users.noreply.github.com"
          git add -- .github/ci/consumers.yml
          git commit -m "chore(ci): refresh verified consumer pins"
          # Never force: changed main or branch protection must reject this push
          # and send the candidate through the PR checks on the current base.
          git push origin HEAD:refs/heads/main

      # The PR action must see a named main checkout at the tested base. For a
      # detached checkout it automatically rebases with a conflict preference
      # that could overwrite concurrent catalog contracts. Keeping this base
      # creates a PR with the tested pin-only diff; GitHub exposes any conflict
      # with newer main for manual resolution instead of choosing older checks.
      - name: Prepare catalog changes for the fallback PR
        if: needs.consumers.result == 'failure' || steps.push.outcome == 'failure'
        run: |
          # Undo a rejected local commit while retaining the candidate staged.
          git reset --soft "$GITHUB_SHA"
          git checkout -B main "$GITHUB_SHA"
          # Failed consumer runs reach this path without a local push commit.
          git add -- .github/ci/consumers.yml
          # The action resets a named working base to its local remote ref.
          # Pin that ref too: never mix newer main with the tested catalog here.
          git update-ref refs/remotes/origin/main "$GITHUB_SHA"

      - name: Open or update the fallback PR
        if: needs.consumers.result == 'failure' || steps.push.outcome == 'failure'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.SCORE_BOT_CLASSIC_PAT }}
          add-paths: .github/ci/consumers.yml
          base: main
          branch: bot/consumer-pin-update
          title: 'chore(ci): refresh consumer compatibility snapshots'
          commit-message: 'chore(ci): refresh consumer compatibility snapshots'
          author: eclipse-score-bot <187756813+eclipse-score-bot@users.noreply.github.com>
          body: |
            Keep the reproducible consumer snapshots current so workflow changes
            are checked against recent SCORE repositories. This updates commit
            pins while retaining required checks and documented exceptions.

            The candidate needs review because compatibility failed or its direct
            push was rejected. Consumer compatibility: `${{ needs.consumers.result }}`.
            Direct push: `${{ steps.push.outcome }}`.

            [Update run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
