name: SCORE PR Checks

on:
  workflow_call:
    inputs:
      runner-labels:
        description: >-
          Runner label(s) for this workflow's jobs, overriding the repository/organization runner
          variables. Must be a JSON-encoded string: a single label as a JSON string (e.g.
          '"self-hosted"') or a JSON array of labels (e.g. '["self-hosted", "linux", "x64"]').
        required: false
        default: ""
        type: string
      github-app-client-id:
        description: GitHub App client ID used with `github-app-private-key` to access private dependencies; omit when using `token`
        required: false
        default: ""
        type: string
    secrets:
      github-app-private-key:
        description: GitHub App private key used with `github-app-client-id` to access private dependencies
        required: false
      token:
        description: Token for private dependencies; an alternative to GitHub App credentials
        required: false

jobs:
  bazel-module-name-check:
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure access to private dependencies
        uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
        # An `if` condition cannot access secrets, so expose only their presence.
        env:
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        if: ${{ env.HAS_GH_APP_PRIVATE_KEY == 'true' || env.HAS_TOKEN == 'true' || inputs.github-app-client-id != '' }}
        with:
          token: ${{ secrets.token }}
          github-app-client-id: ${{ inputs.github-app-client-id }}
          github-app-private-key: ${{ secrets.github-app-private-key }}

      - name: Check MODULE.bazel and validate module name
        run: |
          # Check if MODULE.bazel exists
          if [ ! -f "MODULE.bazel" ]; then
            echo "ℹ️  MODULE.bazel file not found in repository root - skipping Bazel module validation"
            exit 0
          fi

          echo "✅ MODULE.bazel file found"

          # Extract module name from MODULE.bazel
          if ! MODULE_LINE=$(grep '^module(' MODULE.bazel | head -1); then
            echo "❌ No module declaration found in MODULE.bazel"
            exit 1
          fi

          # Extract the module name from the module() declaration
          MODULE_NAME=$(echo "$MODULE_LINE" | sed 's/^module([[:space:]]*name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/' | sed 's/^module([[:space:]]*"\([^"]*\)".*/\1/')

          # Alternative extraction method if the above doesn't work
          if [[ -z "$MODULE_NAME" || "$MODULE_NAME" == "$MODULE_LINE" ]]; then
            MODULE_NAME=$(echo "$MODULE_LINE" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          fi

          echo "Found module name: $MODULE_NAME"

          # Validate against the required regex pattern
          if [[ ! "$MODULE_NAME" =~ ^score_[[:lower:]_]+$ ]]; then
            echo "❌ Invalid module name: $MODULE_NAME"
            echo "Module name must match the pattern: ^score_[[:lower:]_]+$"
            echo "  - Must start with 'score_'"
            echo "  - Must contain only lowercase letters and underscores after 'score_'"
            echo "Examples of valid names: score_cli, score_compose, score_web_api"
            exit 1
          fi

          echo "✅ Module name is valid: $MODULE_NAME"
